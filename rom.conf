# ROM settings. Every value can be overridden from the environment (CI does that
# for ROM_IDENTIFIER).

# Must be the identifier your signing key is registered for on developer.emexlabs.org.
: "${ROM_IDENTIFIER:=io.github.errormoonlight1225.rootless}"
: "${ROM_NAME:=Rootless}"
: "${ROM_VERSION:=0.1}"
# Raise for every release you flash: Nyxian refuses to go back to a lower one.
: "${ROM_SECURITY_VERSION:=1}"
: "${ROM_MIN_NYXIAN:=0.12.0}"

# The Nyxian source the ROM's kernel is built from. There is no 0.12.0 commit or
# tag upstream (Config.xcconfig goes from 0.11.6.4 straight to 0.12.1), so this
# is the 0.12.1 tree. The headers the 0.12.0 release ships in Shared/kernel match
# it: all of ProcEnvironment, ksurface_abi.h and NXLiveProcessABI.h are identical
# (see docs/ANALYSIS.md, section 7).
: "${NYXIAN_REPO:=https://github.com/emexlab/nyxian}"
: "${NYXIAN_REF:=9236c22f146a0f63bb597e629573e151ae4d4df7}"

# The rootless userland that becomes /var/jb: the Procursus bootstrap (apt, dpkg,
# shells, coreutils; 67 packages), fetched at build time and checked against
# this hash. 1900 is the newest suite Procursus publishes a bootstrap for; its
# apt source points at the same suite. Set STRAP_URL to nothing to build with
# an empty /var/jb instead, or STRAP_TAR to a bootstrap archive of your own.
: "${STRAP_URL=https://apt.procurs.us/bootstraps/1900/bootstrap-iphoneos-arm64.tar.zst}"
: "${STRAP_SHA256=8354c3aa1ecdad8ebc47d9a76dfca6f830a2b757278068bd33b98bf1d638a9cb}"

# Packages installed by dpkg on the first boot after flashing: the package
# managers, so that there is a way to install everything else. One per line,
# URL then SHA-256 (from the repository's Packages index). Set to nothing to
# ship none. Packages you have as files go in rom-overlay/debs instead.
: "${FIRSTBOOT_DEBS=https://apt.procurs.us/pool/main/iphoneos-arm64-rootless/1900/sileo/org.coolstar.sileo_2.5.1_iphoneos-arm64.deb 8e3c90e5a7d32f4ca207a0ac30d3cfa8a13dca86a2b4e11cb3f9e5c68d7bc97a
https://apt.procurs.us/pool/main/iphoneos-arm64-rootless/1900/zebra/xyz.willy.zebra_1.1.36_iphoneos-arm64.deb 91900ce44684a2b163b0f887609fff95e3296f58d35b82a83ebb351d46b01052
https://github.com/Lakr233/Irisin/releases/download/v5.1.8/wiki.qaq.irisin_5.1.8_iphoneos-arm64.deb b5c6ee4a6be18c62902f0ea22240e00f2bbf573c46f2984443bff07630cff2e6}"
