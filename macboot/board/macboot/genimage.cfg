image efi-part.vfat {
	vfat {
		files = {
			"efi-part/EFI",
			"bzImage"
		}
	}
	size = 64M
}

image macboot.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		bootable = "true"
		offset = 1M
	}
	partition rootfs {
		image = "rootfs.squashfs"
		partition-type-uuid = L
	}
	# Placeholder; S10macboot-data grows/formats the real MACDATA partition at first boot.
	partition macdata {
		partition-type-uuid = L
		size = 256M
	}
}
