set default=0
set timeout=1

menuentry "MacBoot" {
    linux /bzImage root=PARTLABEL=rootfs ro rootfstype=squashfs quiet loglevel=3 mitigations=off nowatchdog intel_iommu=off transparent_hugepage=madvise
}
menuentry "MacBoot (debug shell)" {
    linux /bzImage root=PARTLABEL=rootfs ro rootfstype=squashfs macboot.shell=1
}
