# Defaults. Override any of these in /data/macboot.conf (the MACDATA partition).

# --- Guest resources ---
GUEST_RAM=8G              # macOS needs >= 4G to be pleasant; this is NOT host overhead
GUEST_CPUS=auto           # "auto" = all host CPUs (must be a power of two for macOS: auto rounds down)
HUGEPAGES=0               # 1 = back guest RAM with 2M hugepages (faster, less host fragmentation)

# --- Files inside /data ---
OPENCORE_IMG=OpenCore/OpenCore.qcow2
OVMF_CODE=OVMF/OVMF_CODE_4M.fd
OVMF_VARS=OVMF/OVMF_VARS.fd          # copied to OVMF_VARS.work.fd on first run (writable)
INSTALL_IMG=BaseSystem.img           # attached only if the file exists; delete it after installing
SYSTEM_DISK=macOS.qcow2
SYSTEM_DISK_SIZE=128G                # created on first boot if missing (sparse)

# --- CPU model presented to macOS (same as upstream OSX-KVM for Sequoia/Tahoe; for older macOS try Haswell-noTSX) ---
CPU_MODEL="Skylake-Client,-hle,-rtm,kvm=on,vendor=GenuineIntel,+invtsc,vmware-cpuid-freq=on"

# --- Display (host KMS/DRM, no X11/Wayland). The guest uses an unaccelerated virtual GPU. ---
GUEST_GPU=vmware-svga

# --- Extra QEMU arguments (advanced) ---
EXTRA_QEMU_ARGS=""
