name: Build launchd

# Compiles nxlaunchd / nxlaunchctl and the /var/jb path layer (rtpatch) for iOS
# arm64 with the iPhone SDK, so they are checked by a real compiler without a
# device in the loop, and runs the path layer's host test.

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/relocate-macho.py'
      - 'scripts/test-relocate*'
      - 'scripts/test-launchd.sh'
      - '.github/workflows/launchd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build for iOS arm64
        run: make -C src ios
      - name: The slot build of nxlaunchd
        run: make -C src slot
      - name: nxlaunchd and nxlaunchctl, run for real on the host
        run: scripts/test-launchd.sh
      - name: Path layer, host test
        run: make -C src/rtpatch test
      - name: Path layer for iOS arm64
        run: make -C src/rtpatch ios
      - name: Library path relocation
        run: |
          python3 -I scripts/test-relocate.py
          scripts/test-relocate-real.sh
      - name: nxfixup, host tests and iOS arm64
        run: |
          make -C src/fixup test
          make -C src/fixup ios
      - uses: actions/upload-artifact@v4
        with:
          name: nxlaunchd
          path: |
            src/build/nxlaunchd
            src/build/nxlaunchctl
            src/rtpatch/build/rtpatch
            src/fixup/build/nxfixup
          if-no-files-found: error
