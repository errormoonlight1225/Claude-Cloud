name: Build IPA

on:
  push:
    branches: ["**"]
    paths:
      - "SideStoreCertExporter/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SideStoreCertExporter.xcodeproj \
            -scheme SideStoreCertExporter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SideStoreCertExporter.app Payload/
          zip -qry SideStoreCertExporter.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SideStoreCertExporter-ipa
          path: SideStoreCertExporter.ipa
