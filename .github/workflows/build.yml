name: Build TapRecorder

on:
  push:
    paths: ["TapRecorder/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + iOS toolchain + SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot xz-utils
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 -q https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/toolchain/linux/iphone
          curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C $THEOS/toolchain/linux/iphone --strip-components=1
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          (cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk)
          mv /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build rootless .deb
        working-directory: TapRecorder
        run: make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: TapRecorder-rootless
          path: TapRecorder/packages/*.deb
