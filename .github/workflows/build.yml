name: Build ROM

# One macOS job per push: the host tests, then the ROM (which compiles every
# iOS part). macOS minutes count ten times in a private repository, so changes
# to documentation alone do not start it.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rom:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Signing key
        env:
          KEY: ${{ secrets.ROM_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            umask 077
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/rom.key.pem"
            echo "ROM_SIGNING_KEY=$RUNNER_TEMP/rom.key.pem" >> "$GITHUB_ENV"
          fi

      - name: Tools for packing the bootstrap
        run: |
          brew install ldid
          command -v zstd || brew install zstd

      - name: Tests
        run: |
          make -C src/rtpatch test
          make -C src/fixup test
          python3 -I scripts/test-relocate.py
          scripts/test-relocate-real.sh
          scripts/test-launchd.sh

      - name: Build
        env:
          ROM_IDENTIFIER: ${{ vars.ROM_IDENTIFIER }}
        run: |
          [ -n "$ROM_IDENTIFIER" ] || unset ROM_IDENTIFIER
          scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: out/rom.zip
          if-no-files-found: error
