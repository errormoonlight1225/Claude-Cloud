name: Build TapRecorder

on:
  push:
    paths: ["TapRecorder/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + Apple clang toolchain + iOS SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot xz-utils libncurses5 libxml2 libedit2 libz3-4 python3
          export THEOS=$HOME/theos
          git clone --recursive --depth=1 -q https://github.com/theos/theos.git $THEOS
          # Apple clang 13 (pointer-auth arm64e codegen) + ld64, from the Theos Swift toolchain.
          curl -sSL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz \
            | tar -xJ -C $THEOS/toolchain
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          (cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk)
          mv /tmp/sdks/iPhoneOS16.5.sdk $THEOS/sdks/
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build rootless .deb
        working-directory: TapRecorder
        run: make package FINALPACKAGE=1

      - name: Verify arm64e slice is marked new-ABI
        working-directory: TapRecorder
        run: |
          caps=$($THEOS/toolchain/linux/iphone/bin/otool -arch arm64e -h .theos/obj/TapRecorder.dylib | tail -1 | awk '{print $4}')
          echo "arm64e caps: $caps"
          [ "$caps" = "0x80" ] || { echo "::error::arm64e slice is not new-ABI"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: TapRecorder-rootless
          path: TapRecorder/packages/*.deb

