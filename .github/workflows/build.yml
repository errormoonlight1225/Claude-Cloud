name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build and run
        run: make -C Tests/core -j4 test

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Kiln.xcodeproj -scheme Kiln -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*Kiln/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Kiln.app
      - name: Inspect app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/Kiln.app
          ls -la "$APP" "$APP/Frameworks" 2>/dev/null || true
          otool -L "$APP/Kiln"
          # OpenSSL must be linked either statically or as an embedded framework.
          if otool -L "$APP/Kiln" | grep -q "OpenSSL.framework"; then test -d "$APP/Frameworks/OpenSSL.framework"; fi
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Kiln.app out/Payload/
          cd out && zip -qry Kiln-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kiln-unsigned-ipa
          path: out/Kiln-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
