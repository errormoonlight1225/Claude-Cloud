name: Build AutoTapper DEB

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'AutoTapper/**'
      - '.github/workflows/build-autotapper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'AutoTapper/**'
      - '.github/workflows/build-autotapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos and iOS SDK
        uses: waruhachi/theos-action@main
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Build rootless package
        run: |
          cd AutoTapper
          make clean package FINALPACKAGE=1

      - name: Prepare standalone injection dylib
        run: |
          mkdir -p injection
          DYLIB="$(find AutoTapper/.theos .theos -type f -name 'AutoTapper.dylib' -print -quit 2>/dev/null || true)"
          if [ -z "$DYLIB" ]; then
            DYLIB="$(find AutoTapper -type f -name 'AutoTapper.dylib' -print -quit)"
          fi
          test -n "$DYLIB"
          cp "$DYLIB" injection/AutoTapper.dylib
          cat > injection/README.txt <<'EOF'
          AutoTapper standalone tweak dylib
          This is an injection component, not a signed IPA.
          Only inject into apps/devices you own or are authorized to test.
          Requires a compatible jailbreak/injection environment and matching arm64/arm64e runtime.
          OCR finds text and sets a coordinate only; it does not auto-submit orders or bypass queues/captchas.
          EOF

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-deb
          path: AutoTapper/packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload injection dylib
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-injection-dylib
          path: injection/*
          if-no-files-found: error
          retention-days: 14
