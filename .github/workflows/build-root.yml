name: Build AmneziaWG root DEB

on:
  push:
    branches: [amneziawg-ios12]
    paths:
      - 'awg-root/**'
      - '.github/workflows/build-root.yml'
      - 'amneziawg-apple/Sources/WireGuardKitGo/goruntime-*.diff'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: awg-root/go.mod
          cache-dependency-path: awg-root/go.sum

      - name: Prepare patched Go root
        run: |
          # Go's arm64 procyield reads CNTVCT_EL0, which raises SIGILL on A8 devices under iOS.
          PATCHED="$RUNNER_TEMP/goroot"
          rsync -a --delete "$(go env GOROOT)/" "$PATCHED/"
          patch -p1 -d "$PATCHED" < amneziawg-apple/Sources/WireGuardKitGo/goruntime-procyield-no-cntvct.diff
          echo "GOROOT=$PATCHED" >> "$GITHUB_ENV"

      - name: Test and build
        working-directory: awg-root
        run: |
          go version
          go test ./...
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=12.0"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
            CC="$(xcrun --sdk iphoneos --find clang)" CGO_CFLAGS="$FLAGS" CGO_LDFLAGS="$FLAGS" \
            go build -trimpath -ldflags="-s -w" -o awg-root .
          file awg-root
          otool -l awg-root | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" || true

      - name: Check for counter-timer reads
        working-directory: awg-root
        run: |
          n=$(xcrun otool -tv awg-root | grep -ciE 'mrs.*(cntvct|cntpct|S3_3_C14_C0_[012])' || true)
          echo "mrs counter-timer reads: $n"
          test "$n" = 0

      - name: Build GUI app
        working-directory: awg-root/app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios12.0 -sdk "$SDK" -module-name AWGRoot -O -o AWGRoot main.swift
          rm -rf AWGRoot.app && mkdir AWGRoot.app
          cp AWGRoot AWGRoot.app/AWGRoot
          cp Info.plist AWGRoot.app/Info.plist
          plutil -convert binary1 AWGRoot.app/Info.plist
          xcrun ibtool --compile AWGRoot.app/LaunchScreen.storyboardc LaunchScreen.storyboard \
            --minimum-deployment-target 12.0 --target-device iphone --target-device ipad
          file AWGRoot.app/AWGRoot
          otool -l AWGRoot.app/AWGRoot | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" || true
          ls -la AWGRoot.app

      - name: Package DEB
        working-directory: awg-root
        run: |
          brew install ldid dpkg
          ldid -S awg-root
          ldid -Sapp/entitlements.plist app/AWGRoot.app/AWGRoot
          ldid -e app/AWGRoot.app/AWGRoot
          VERSION=0.2.0
          ROOT=deb
          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr/bin" "$ROOT/etc/amneziawg" "$ROOT/Applications" "$ROOT/DEBIAN"
          # setuid root so the GUI (running as mobile) can drive it; it only accepts stored config names from non-root callers.
          install -m 4755 awg-root "$ROOT/usr/bin/awg-root"
          cp -R app/AWGRoot.app "$ROOT/Applications/AWGRoot.app"
          for cmd in up down status; do
            printf '#!/bin/sh\nexec /usr/bin/awg-root %s "$@"\n' "$cmd" > "$ROOT/usr/bin/awg-$cmd"
            chmod 755 "$ROOT/usr/bin/awg-$cmd"
          done
          chmod 700 "$ROOT/etc/amneziawg"
          printf '#!/bin/sh\nchown root:wheel /usr/bin/awg-root\nchmod 4755 /usr/bin/awg-root\nuicache -p /Applications/AWGRoot.app 2>/dev/null || uicache\nexit 0\n' > "$ROOT/DEBIAN/postinst"
          printf '#!/bin/sh\nif [ "$1" = remove ] || [ "$1" = purge ]; then /usr/bin/awg-root down >/dev/null 2>&1; fi\nexit 0\n' > "$ROOT/DEBIAN/prerm"
          printf '#!/bin/sh\nuicache 2>/dev/null\nexit 0\n' > "$ROOT/DEBIAN/postrm"
          chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm" "$ROOT/DEBIAN/postrm"
          cat > "$ROOT/DEBIAN/control" <<CTL
          Package: org.amnezia.awg-root
          Name: AmneziaWG (root)
          Version: $VERSION
          Architecture: iphoneos-arm
          Section: Networking
          Depends: network-cmds
          Maintainer: AmneziaWG
          Description: AmneziaWG VPN as a root daemon, without Network Extension. Includes the AWG Root app; awg-up/awg-down/awg-status work from the shell too.
          CTL
          sed -i '' 's/^          //' "$ROOT/DEBIAN/control"
          dpkg-deb -Zgzip --root-owner-group -b "$ROOT" "org.amnezia.awg-root_${VERSION}_iphoneos-arm.deb"
          dpkg-deb -I "org.amnezia.awg-root_${VERSION}_iphoneos-arm.deb"
          dpkg-deb -c "org.amnezia.awg-root_${VERSION}_iphoneos-arm.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: AmneziaWG-root-deb
          path: awg-root/*.deb
