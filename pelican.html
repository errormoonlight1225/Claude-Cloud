<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕测试 - Pelican on a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; background: #bfe6ff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg { width: min(96vw, 800px); height: auto; background: linear-gradient(#bfe6ff, #eaf7ff); border-radius: 12px; }
  h1 { font-size: 18px; color: #234; margin: 8px; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
  .leg { transform-box: fill-box; transform-origin: top center; animation: pedal 2s ease-in-out infinite; }
  .bob { animation: bob 1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pedal { 50% { transform: rotate(-12deg); } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车 · Pelican on a Bicycle</h1>
<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <!-- ground -->
  <rect y="430" width="800" height="90" fill="#8fd18f"/>
  <rect y="425" width="800" height="8" fill="#6bb86b"/>
  <circle cx="680" cy="80" r="40" fill="#ffe27a"/>

  <!-- bicycle -->
  <g stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel"><circle cx="230" cy="370" r="62"/><path d="M230 308V432M168 370H292M186 326L274 414M274 326L186 414" stroke-width="2"/></g>
    <g class="wheel"><circle cx="570" cy="370" r="62"/><path d="M570 308V432M508 370H632M526 326L614 414M614 326L526 414" stroke-width="2"/></g>
    <path d="M230 370 L330 370 L400 270 L520 270 L570 370"/>
    <path d="M330 370 L360 270 L400 270"/>
    <path d="M520 270 L505 245 M490 245 H525"/>
    <path d="M350 270 H385" stroke-width="10"/>
    <circle cx="330" cy="370" r="14" fill="#555"/>
  </g>

  <!-- pelican -->
  <g class="bob">
    <!-- tail -->
    <path d="M300 235 L240 255 L305 262 Z" fill="#dcdcdc" stroke="#999" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="365" cy="240" rx="80" ry="52" fill="#fff" stroke="#bbb" stroke-width="3"/>
    <!-- wing -->
    <path d="M330 225 Q380 200 430 235 Q390 280 335 258 Z" fill="#e6e6e6" stroke="#aaa" stroke-width="3"/>
    <!-- neck -->
    <path d="M420 215 Q470 190 462 140 Q458 110 475 100" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M409 215 Q459 190 451 140 Q447 110 465 100" stroke="#ccc" stroke-width="2" fill="none"/>
    <!-- head -->
    <circle cx="485" cy="95" r="26" fill="#fff" stroke="#bbb" stroke-width="3"/>
    <!-- beak -->
    <path d="M505 88 L640 100 Q600 112 508 112 Z" fill="#f5a623" stroke="#c77d0a" stroke-width="3"/>
    <path d="M508 108 Q560 150 636 104 Q580 118 508 112 Z" fill="#ffc94d" stroke="#c77d0a" stroke-width="3"/>
    <!-- eye -->
    <circle cx="492" cy="86" r="5" fill="#111"/><circle cx="494" cy="84" r="1.6" fill="#fff"/>
    <!-- legs -->
    <g class="leg"><path d="M370 285 L350 330 L330 370" stroke="#f5a623" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M322 372 h26" stroke="#c77d0a" stroke-width="8" stroke-linecap="round"/></g>
    <!-- arm/wing to handlebar -->
    <path d="M420 240 Q470 250 495 247" stroke="#e6e6e6" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
