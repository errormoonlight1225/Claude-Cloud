name: ClaudeClient
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudeClient:
    type: application
    platform: iOS
    sources:
      - path: ClaudeClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.claudeclient
        INFOPLIST_FILE: ClaudeClient/Info.plist
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    scheme: {}
