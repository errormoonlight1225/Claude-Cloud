name: Kiln
options:
  bundleIdPrefix: com.kiln
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL-Package
    exactVersion: "3.6.3000"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    CLANG_CXX_LIBRARY: libc++
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kiln:
    type: application
    platform: iOS
    sources:
      - path: Kiln
        excludes:
          - "Info.plist"
      - path: Vendor/zsign/src
        compilerFlags: ["-w"]
    info:
      path: Kiln/Info.plist
      properties:
        CFBundleDisplayName: Kiln
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Exports / signed IPAs are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [itms-services]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [ipa]
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobileprovision]
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiln.installer
        PRODUCT_NAME: Kiln
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Kiln/Bridge/Kiln-Bridging-Header.h
        # -iquote only, so zsign's util.h/log.h never shadow system headers.
        USER_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Kiln/Core
          - $(SRCROOT)/Kiln/Bridge
          - $(SRCROOT)/Vendor/zsign/src
          - $(SRCROOT)/Vendor/zsign/src/common
          - $(SRCROOT)/Vendor/zsign/src/third-party/zlib
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    dependencies:
      - package: OpenSSL
        product: OpenSSL
