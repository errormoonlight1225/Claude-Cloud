name: SideStoreCertExporter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  SideStoreCertExporter:
    type: application
    platform: iOS
    sources:
      - path: SideStoreCertExporter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sidestorecertexporter
        PRODUCT_NAME: SideStoreCertExporter
        INFOPLIST_FILE: SideStoreCertExporter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
